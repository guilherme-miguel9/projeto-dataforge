dbt_dataforge:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      user: "{{ env_var('DB_USER', 'postgres') }}"
      password: "{{ env_var('DB_PASSWORD', 'postgrespassword') }}"
      dbname: "{{ env_var('DB_NAME', 'dataforge_dw') }}"
      schema: "{{ env_var('DB_SCHEMA', 'leitura_star') }}"
      threads: 4
