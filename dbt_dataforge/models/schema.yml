version: 2

models:
  - name: dim_tempo
    description: "Dimensão de tempo com granularidade diária"
    columns:
      - name: id_tempo
        description: "Chave primária da dimensão tempo (YYYYMMDD)"
        tests:
          - unique
          - not_null
      - name: data_completa
        tests:
          - not_null

  - name: dim_cliente
    description: "Dimensão cliente (SCD Tipo 1)"
    columns:
      - name: id_cliente
        description: "Chave substituta do cliente"
        tests:
          - unique
          - not_null
      - name: nome_cliente
        tests:
          - not_null

  - name: dim_agente
    description: "Dimensão agente leiturista (SCD Tipo 1)"
    columns:
      - name: id_agente
        description: "Chave substituta do agente leiturista"
        tests:
          - unique
          - not_null
      - name: cod_leit
        tests:
          - not_null

  - name: dim_instalacao_contrato
    description: "Dimensão de instalação e contrato (SCD Tipo 1)"
    columns:
      - name: id_instalacao
        description: "Chave substituta da instalação/contrato"
        tests:
          - unique
          - not_null
      - name: instal
        tests:
          - not_null

  - name: dim_status_leitura
    description: "Junk dimension de status e flags da leitura (SCD Tipo 1)"
    columns:
      - name: id_status
        description: "Chave substituta do agrupamento de status"
        tests:
          - unique
          - not_null

  - name: dim_medidor
    description: "Dimensão medidor versionada (SCD Tipo 2)"
    columns:
      - name: id_medidor
        description: "Chave técnica da versão do medidor"
        tests:
          - unique
          - not_null
      - name: nro_serie
        tests:
          - not_null
      - name: data_inicio_validade
        tests:
          - not_null

  - name: dim_localizacao
    description: "Dimensão localização geográfica versionada (SCD Tipo 2)"
    columns:
      - name: id_localizacao
        description: "Chave técnica da versão da localização"
        tests:
          - unique
          - not_null
      - name: data_inicio_validade
        tests:
          - not_null

  - name: fato_leitura
    description: "Tabela fato central particionada por ano"
    columns:
      - name: id_fato_leitura
        description: "Chave técnica do fato"
        tests:
          - not_null
      - name: ano
        tests:
          - not_null
      - name: fk_tempo
        tests:
          - not_null
          - relationships:
              to: ref('dim_tempo')
              field: id_tempo
      - name: fk_cliente
        tests:
          - not_null
          - relationships:
              to: ref('dim_cliente')
              field: id_cliente
      - name: fk_instalacao
        tests:
          - not_null
          - relationships:
              to: ref('dim_instalacao_contrato')
              field: id_instalacao
      - name: fk_medidor
        tests:
          - not_null
          - relationships:
              to: ref('dim_medidor')
              field: id_medidor
      - name: fk_localizacao
        tests:
          - not_null
          - relationships:
              to: ref('dim_localizacao')
              field: id_localizacao
      - name: fk_agente
        tests:
          - not_null
          - relationships:
              to: ref('dim_agente')
              field: id_agente
      - name: fk_status
        tests:
          - not_null
          - relationships:
              to: ref('dim_status_leitura')
              field: id_status
