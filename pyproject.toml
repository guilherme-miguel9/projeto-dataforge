[project]
name = "projeto-dataforge"
version = "0.1.0"
description = "Plataforma de Engenharia de Dados com Arquitetura Medalhao, MinIO, Polars, PostgreSQL e dbt"
authors = [
    {name = "Guilherme Miguel"}
]
readme = "README.md"
requires-python = ">=3.11, <3.15"
dependencies = [
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "polars (>=1.43.2,<2.0.0)",
    "pyarrow (>=25.0.1,<26.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "boto3 (>=1.43.78,<2.0.0)",
    "dbt-core (>=1.12.3,<2.0.0)",
    "dbt-postgres (>=1.11.0,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.3,<0.17.0)"
]

[tool.poetry]                                                                                                         
packages = [{include = "dataforge", from = "src"}]   

